name: Deploy site

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 
        uses: actions/checkout@v4
        
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick libmagickwand-dev
          # Фикс для ImageMagick 7 (Ubuntu 24.04): создаем симлинк convert -> magick
          if ! command -v convert &> /dev/null; then
            sudo ln -s $(which magick) /usr/local/bin/convert || true
          fi
          
      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          # --break-system-packages обходит защиту PEP 668 в новых Ubuntu
          # --user ставит пакеты в пользовательскую директорию
          python3 -m pip install --user --break-system-packages jupyter nbconvert ipykernel
          
          # КРИТИЧНО: добавляем папку с исполняемыми файлами Python в PATH, 
          # чтобы Jekyll (который запустится в следующем шаге) смог найти команду jupyter
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
      - name: Install JS deps 
        run: npm ci || echo "No package.json, skipping"
        
      - name: Update _config.yml 
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}
          
      - name: Install and Build 
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build
          
      - name: Purge unused CSS 
        run: |
          npm install -g purgecss || true
          purgecss -c purgecss.config.js || echo "No purgecss config, skipping"
          
      - name: Deploy 
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
